- name: Deploy Grafana Alloy
  hosts: Production
  vars_files:
    - credentials.yml
  vars:
    grafana_prometheus_remote_write_url: https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom/push
    grafana_loki_push_url: https://logs-prod-036.grafana.net/loki/api/v1/push
  remote_user: root
  tasks:
    - name: Ensure network exists
      docker_network:
        name: coduels
        state: present

    - name: Ensure Alloy config directory exists
      file:
        path: /opt/coduels/alloy
        state: directory
        mode: "0755"

    - name: Ensure Alloy storage directory exists
      file:
        path: /var/lib/coduels/alloy
        state: directory
        mode: "0755"

    - name: Pull Alloy image
      docker_image:
        name: grafana/alloy
        tag: latest
        source: pull
        force_source: true

    - name: Validate and install Alloy config
      block:
        - name: Render candidate Alloy config
          template:
            src: ../../config.alloy.j2
            dest: /opt/coduels/alloy/config.alloy.candidate
            mode: "0600"
          no_log: true

        - name: Validate candidate Alloy config
          ansible.builtin.command: >
            docker run --rm
            -v /opt/coduels/alloy/config.alloy.candidate:/etc/alloy/config.alloy:ro
            grafana/alloy:latest validate /etc/alloy/config.alloy
          changed_when: false
          no_log: true

        - name: Install validated Alloy config
          ansible.builtin.copy:
            src: /opt/coduels/alloy/config.alloy.candidate
            dest: /opt/coduels/alloy/config.alloy
            remote_src: true
            mode: "0600"
          no_log: true
      always:
        - name: Remove candidate Alloy config
          ansible.builtin.file:
            path: /opt/coduels/alloy/config.alloy.candidate
            state: absent
          no_log: true

    - name: Run Alloy container
      docker_container:
        name: alloy
        image: grafana/alloy:latest
        recreate: yes
        restart: yes
        restart_policy: unless-stopped
        command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
        volumes:
          - "/opt/coduels/alloy/config.alloy:/etc/alloy/config.alloy:ro"
          - "/var/lib/coduels/alloy:/var/lib/alloy/data"
          - "/var/run/docker.sock:/var/run/docker.sock"
          - "/proc:/host/proc:ro"
          - "/sys:/host/sys:ro"
          - "/:/host/root:ro"
        networks:
          - name: coduels
    - name: Inspect Alloy container for readiness
      community.docker.docker_container_info:
        name: alloy
      register: alloy_container
      no_log: true
    - name: Ensure Alloy has a Docker network address
      ansible.builtin.assert:
        that:
          - alloy_container.container.State.Running
          - alloy_container.container.NetworkSettings.Networks.coduels.IPAddress | length > 0
        fail_msg: "Alloy is not running on the coduels network; inspect its container logs before retrying."
    - name: Wait for Alloy configuration to load
      ansible.builtin.uri:
        url: "http://{{ alloy_container.container.NetworkSettings.Networks.coduels.IPAddress }}:12345/-/ready"
        status_code: 200
        timeout: 5
        use_proxy: false
      register: alloy_readiness
      until: alloy_readiness.status == 200
      retries: 30
      delay: 2
