name: Alloy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths:
      - alloy/**
      - .github/workflows/alloy_pull_request.yml

permissions:
  contents: read

jobs:
  check-template:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Render and validate Alloy configuration
        run: |
          python -m pip install jinja2
          python - <<'PY'
          import os
          from pathlib import Path
          from jinja2 import Environment, StrictUndefined

          template = Path('alloy/config.alloy.j2').read_text(encoding='utf-8')
          rendered = Environment(undefined=StrictUndefined).from_string(template).render(
              grafana_prometheus_remote_write_url='https://example.invalid/api/prom/push',
              grafana_prometheus_username='test',
              grafana_api_key='dummy',
              grafana_loki_push_url='https://example.invalid/loki/api/v1/push',
              grafana_loki_username='test',
          )
          Path(os.environ['RUNNER_TEMP'], 'alloy-config.alloy').write_text(rendered, encoding='utf-8')
          PY
          docker run --rm -v "$RUNNER_TEMP/alloy-config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:latest validate /etc/alloy/config.alloy

  deploy:
    needs: check-template
    runs-on: ubuntu-latest
    concurrency:
      group: production-alloy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python and ansible
        run: |
          sudo apt update
          sudo apt install -y python3-pip
          pip3 install ansible docker

      - name: Create ansible vault password file
        run: echo "${{ secrets.VAULT_PASSWORD }}" > ~/vault_pass.txt

      - name: Run ansible playbook
        run: |
          cd alloy/ansible/deploy
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i inventory playbook.yml \
            --extra-vars="ansible_user=root ansible_password=${{ secrets.SSH_PASSWORD }}" \
            --vault-password-file ~/vault_pass.txt

      - name: Clean up
        if: always()
        run: rm -f ~/vault_pass.txt
