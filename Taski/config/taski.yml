env: dev
http_server:
  addr: localhost:5252
  metrics_addr: 0.0.0.0:9090
filestorage:
  root_dir: file_storage
  trasher:
    workers: 1
    collector_iterations_delay: 60
    worker_iterations_delay: 5
db:
  connection_string: host=localhost port=5434 database=taski user=taski password=secret
  init_timeout: 5m
execute:
  endpoint: http://localhost:5253
  download_task_endpoint: http://localhost:5252
event_consumer:
  mode: rest
  rest_endpoint: http://localhost:5253 # mode: rest
  poll_interval: 250ms # mode: rest
  messages_count: 100 # mode: rest
  brokers: [] # mode: kafka
  topic: exesh.step-updates # mode: kafka
  group_id: taski # mode: kafka
  fetch_interval: 50ms # mode: kafka
  sasl_auth: false # mode: kafka
  sasl_username: "" # mode: kafka, sasl_auth: true
  sasl_password: "" # mode: kafka, sasl_auth: true
message_dispatcher:
  kafka_enabled: false
  brokers: [] # kafka_enabled: true
  topic: taski.testing # kafka_enabled: true
  sasl_auth: false # kafka_enabled: true
  sasl_username: "" # kafka_enabled: true, sasl_auth: true
  sasl_password: "" # kafka_enabled: true, sasl_auth: true
metrics_collector:
  collect_interval: 5s
task_topics: []
