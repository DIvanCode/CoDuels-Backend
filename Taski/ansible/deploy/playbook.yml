- name: Deploy
  hosts: Production
  vars_files:
    - credentials.yml
  vars:
    tasks_dir: "{{ ansible_env.HOME }}/tasks"
  remote_user: root
  tasks:
    - name: Require internal auth key from credentials.yml
      assert:
        that:
          - internal_auth_key is defined
          - internal_auth_key | default('') | length > 0
          - internal_auth_key != 'INTERNAL_AUTH_KEY_LOCAL_VALUE'
        fail_msg: Add the shared internal_auth_key to encrypted credentials.yml before deployment.
      no_log: true
    - name: Ensure network exists
      docker_network:
        name: coduels
        state: present
    - name: Ensure tasks directory exists
      file:
        path: "{{ tasks_dir }}/storage"
        state: directory
        mode: "0755"
    - name: Pull taski image
      docker_image:
        name: divancode74/coduels-taski
        tag: "{{ version }}"
        source: pull
        force_source: true
    - name: Run taski container
      docker_container:
        name: taski
        image: "divancode74/coduels-taski:{{ version }}"
        recreate: yes
        restart: yes
        restart_policy: unless-stopped
        ports:
          - "5252:5252"
          - "9077:9090"
        env:
          ENV: prod
          INTERNAL_AUTH_KEY: "{{ internal_auth_key }}"
          CONFIG_PATH: /app/config/taski.yml
          HTTP_SERVER_ADDR: 0.0.0.0:5252
          DB_CONNECTION_STRING: "{{ postgres_connection }}"
          EXECUTE_ENDPOINT: http://coordinator:5253
          EXECUTE_DOWNLOAD_TASK_ENDPOINT: http://taski:5252
          EVENT_CONSUMER_MODE: rest
          EVENT_CONSUMER_REST_ENDPOINT: http://coordinator:5253
        volumes:
          - "{{ tasks_dir }}/storage:/app/file_storage/storage"
        networks:
          - name: coduels
