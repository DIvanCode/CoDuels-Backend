- name: Deploy
  hosts: Production
  vars_files:
    - credentials.yml
  remote_user: root
  tasks:
    - name: Ensure network exists
      docker_network:
        name: coduels
        state: present
    - name: Pull analyzer image
      docker_image:
        name: divancode74/coduels-analyzer
        tag: "{{ version }}"
        source: pull
        force_source: true
    - name: Run analyzer container
      docker_container:
        name: analyzer
        image: "divancode74/coduels-analyzer:{{ version }}"
        recreate: yes
        restart: yes
        restart_policy: unless-stopped
        env:
          INTERNAL_AUTH_KEY: "{{ internal_auth_key }}"
          ANALYZER_PROD_MODEL_PATH: /app/artifacts/prod_random_forest.pkl
          ANALYZER_BASELINE_MODEL_PATH: /app/artifacts/baseline_logreg.pkl
        networks:
          - name: coduels
    - name: Inspect Analyzer container for readiness
      community.docker.docker_container_info:
        name: analyzer
      register: analyzer_container
      no_log: true
    - name: Wait for Analyzer health endpoint
      ansible.builtin.uri:
        url: "http://{{ analyzer_container.container.NetworkSettings.Networks.coduels.IPAddress }}:8000/health"
        status_code: 200
        timeout: 5
        use_proxy: false
      register: analyzer_readiness
      until: analyzer_readiness.status == 200
      retries: 30
      delay: 2
