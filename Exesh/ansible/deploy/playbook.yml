- name: Deploy
  hosts: Production
  vars_files:
    - credentials.yml
  remote_user: root
  tasks:
    - name: Ensure network exists
      docker_network:
        name: coduels
        state: present
    - name: Pull coordinator image
      docker_image:
        name: divancode74/coduels-exesh
        tag: "{{ version }}"
        source: pull
        force_source: true
    - name: Run coordinator container
      docker_container:
        name: coordinator
        image: "divancode74/coduels-exesh:{{ version }}"
        recreate: yes
        restart: yes
        restart_policy: unless-stopped
        command:
          - /app/bin/coordinator
        env:
          ENV: prod
          INTERNAL_AUTH_KEY: "{{ internal_auth_key }}"
          CONFIG_PATH: /app/config/coordinator.yml
          STORAGE_CONNECTION_STRING: "{{ coordinator_postgres_connection }}"
          HTTP_SERVER_ADDR: 0.0.0.0:5253
          HTTP_SERVER_METRICS_ADDR: 0.0.0.0:9090
          JOB_FACTORY_FILESTORAGE_ENDPOINT: http://coordinator:5253
        networks:
          - name: coduels
    - name: Inspect coordinator container for readiness
      community.docker.docker_container_info:
        name: coordinator
      register: coordinator_container
      no_log: true
    - name: Wait for coordinator API listener
      ansible.builtin.wait_for:
        host: "{{ coordinator_container.container.NetworkSettings.Networks.coduels.IPAddress }}"
        port: 5253
        state: started
        timeout: 60
    - name: Wait for coordinator metrics endpoint
      ansible.builtin.uri:
        url: "http://{{ coordinator_container.container.NetworkSettings.Networks.coduels.IPAddress }}:9090/"
        status_code: 200
        timeout: 5
        use_proxy: false
      register: coordinator_metrics_readiness
      until: coordinator_metrics_readiness.status == 200
      retries: 30
      delay: 2
    - name: Run worker-1 container
      docker_container:
        name: worker-1
        image: "divancode74/coduels-exesh:{{ version }}"
        recreate: yes
        restart: yes
        restart_policy: unless-stopped
        command:
          - /app/bin/worker
        privileged: true
        env:
          ENV: prod
          INTERNAL_AUTH_KEY: "{{ internal_auth_key }}"
          CONFIG_PATH: /app/config/worker.yml
          HTTP_SERVER_ADDR: 0.0.0.0:5254
          HTTP_SERVER_METRICS_ADDR: 0.0.0.0:9091
          FILE_STORAGE_ROOT_DIR: /file_storage/worker-1
          WORKER_ID: http://worker-1:5254
          WORKER_FREE_SLOTS: "4"
          WORKER_AVAILABLE_MEMORY_MB: "2048"
          WORKER_COORDINATOR_ENDPOINT: http://coordinator:5253
        networks:
          - name: coduels
    - name: Inspect worker-1 container for readiness
      community.docker.docker_container_info:
        name: worker-1
      register: worker_1_container
      no_log: true
    - name: Wait for worker-1 API listener
      ansible.builtin.wait_for:
        host: "{{ worker_1_container.container.NetworkSettings.Networks.coduels.IPAddress }}"
        port: 5254
        state: started
        timeout: 60
    - name: Wait for worker-1 metrics endpoint
      ansible.builtin.uri:
        url: "http://{{ worker_1_container.container.NetworkSettings.Networks.coduels.IPAddress }}:9091/"
        status_code: 200
        timeout: 5
        use_proxy: false
      register: worker_1_metrics_readiness
      until: worker_1_metrics_readiness.status == 200
      retries: 30
      delay: 2
    - name: Run worker-2 container
      docker_container:
        name: worker-2
        image: "divancode74/coduels-exesh:{{ version }}"
        recreate: yes
        restart: yes
        restart_policy: unless-stopped
        command:
          - /app/bin/worker
        privileged: true
        env:
          ENV: prod
          INTERNAL_AUTH_KEY: "{{ internal_auth_key }}"
          CONFIG_PATH: /app/config/worker.yml
          HTTP_SERVER_ADDR: 0.0.0.0:5255
          HTTP_SERVER_METRICS_ADDR: 0.0.0.0:9092
          FILE_STORAGE_ROOT_DIR: /file_storage/worker-2
          WORKER_ID: http://worker-2:5255
          WORKER_FREE_SLOTS: "4"
          WORKER_AVAILABLE_MEMORY_MB: "2048"
          WORKER_COORDINATOR_ENDPOINT: http://coordinator:5253
        networks:
          - name: coduels
    - name: Inspect worker-2 container for readiness
      community.docker.docker_container_info:
        name: worker-2
      register: worker_2_container
      no_log: true
    - name: Wait for worker-2 API listener
      ansible.builtin.wait_for:
        host: "{{ worker_2_container.container.NetworkSettings.Networks.coduels.IPAddress }}"
        port: 5255
        state: started
        timeout: 60
    - name: Wait for worker-2 metrics endpoint
      ansible.builtin.uri:
        url: "http://{{ worker_2_container.container.NetworkSettings.Networks.coduels.IPAddress }}:9092/"
        status_code: 200
        timeout: 5
        use_proxy: false
      register: worker_2_metrics_readiness
      until: worker_2_metrics_readiness.status == 200
      retries: 30
      delay: 2
