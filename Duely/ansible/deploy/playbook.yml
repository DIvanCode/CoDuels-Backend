- name: Deploy
  hosts: Production
  vars_files:
    - credentials.yml
  remote_user: root
  tasks:
    - name: Ensure network exists
      docker_network:
        name: coduels
        state: present
    - name: Pull duely-migration image
      docker_image:
        name: divancode74/coduels-duely-migration
        tag: "{{ version }}"
        source: pull
        force_source: true
    - name: Pull duely image
      docker_image:
        name: divancode74/coduels-duely
        tag: "{{ version }}"
        source: pull
        force_source: true
    - name: Run duely-migration container
      docker_container:
        name: duely-migration
        image: "divancode74/coduels-duely-migration:{{ version }}"
        recreate: yes
        cleanup: true
        detach: false
        env:
          DbConnection__ConnectionString: "{{ postgres_connection }}"
        command: |
          bash -c '/root/.dotnet/tools/dotnet-ef database update \
          --connection "$DbConnection__ConnectionString" \
          --startup-project /app/src/Duely \
          --project /app/src/Duely.Infrastructure.DataAccess.EntityFramework'
      register: migration_result
    - name: Fail if migration failed
      fail:
        msg: "Migration failed!"
      when: migration_result.status != 0
    - name: Run duely container
      docker_container:
        name: duely
        image: "divancode74/coduels-duely:{{ version }}"
        recreate: yes
        restart: yes
        restart_policy: unless-stopped
        env:
          ASPNETCORE_ENVIRONMENT: "Production"
          InternalAuthKey: "{{ internal_auth_key }}"
          DbConnection__ConnectionString: "{{ postgres_connection }}"
          JwtToken__SecretKey: "{{ jwt_secret_key }}"
          WebSocketConnection__KeepAliveIntervalMs: "5000"
          WebSocketConnection__CloseTimeoutMs: "1000"
          TournamentSynchronizationJob__CheckIntervalMs: "1000"
          AnticheatBackgroundService__CheckIntervalMs: "5000"
          Outbox__CheckIntervalMs: "250"
          Outbox__BatchSize: "200"
          Outbox__MaxRetryDelayMs: "30000"
          DuelEndWatcherJob__CheckIntervalMs: "1000"
          DuelMakingJob__CheckPairIntervalMs: "1000"
          RateLimiting__SubmissionsPerMinute: "10"
          RateLimiting__RunsPerMinute: "30"
          Taski__BaseUrl: http://taski:5252
          Exesh__BaseUrl: http://coordinator:5253
          Exesh__StatusUpdates__Count: "50"
          Exesh__StatusUpdates__PollIntervalMs: "2000"
          Analyzer__BaseUrl: http://analyzer:8000
        networks:
          - name: coduels
    - name: Inspect Duely container for readiness
      community.docker.docker_container_info:
        name: duely
      register: duely_container
      no_log: true
    - name: Wait for Duely metrics endpoint
      ansible.builtin.uri:
        url: "http://{{ duely_container.container.NetworkSettings.Networks.coduels.IPAddress }}:5001/metrics"
        status_code: 200
        timeout: 5
        use_proxy: false
      register: duely_readiness
      until: duely_readiness.status == 200
      retries: 30
      delay: 2
