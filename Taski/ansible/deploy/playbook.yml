- name: Deploy
  hosts: Production
  vars_files:
    - credentials.yml
  vars:
    tasks_dir: "{{ ansible_env.HOME }}/tasks"
  remote_user: root
  tasks:
    - name: Ensure network exists
      docker_network:
        name: coduels
        state: present
    - name: Ensure tasks directory exists
      file:
        path: "{{ tasks_dir }}/storage"
        state: directory
        mode: "0755"
    - name: Pull taski image
      docker_image:
        name: divancode74/coduels-taski
        tag: "{{ version }}"
        source: pull
        force_source: true
    - name: Run taski container
      docker_container:
        name: taski
        image: "divancode74/coduels-taski:{{ version }}"
        recreate: yes
        restart: yes
        restart_policy: unless-stopped
        env:
          ENV: prod
          INTERNAL_AUTH_KEY: "{{ internal_auth_key }}"
          CONFIG_PATH: /app/config/taski.yml
          HTTP_SERVER_ADDR: 0.0.0.0:5252
          DB_CONNECTION_STRING: "{{ postgres_connection }}"
          EXECUTE_ENDPOINT: http://coordinator:5253
          EXECUTE_DOWNLOAD_TASK_ENDPOINT: http://taski:5252
          EVENT_CONSUMER_MODE: rest
          EVENT_CONSUMER_REST_ENDPOINT: http://coordinator:5253
        volumes:
          - "{{ tasks_dir }}/storage:/app/file_storage/storage"
        networks:
          - name: coduels
    - name: Inspect Taski container for readiness
      community.docker.docker_container_info:
        name: taski
      register: taski_container
      no_log: true
    - name: Wait for Taski API listener
      ansible.builtin.wait_for:
        host: "{{ taski_container.container.NetworkSettings.Networks.coduels.IPAddress }}"
        port: 5252
        state: started
        timeout: 60
    - name: Wait for Taski metrics endpoint
      ansible.builtin.uri:
        url: "http://{{ taski_container.container.NetworkSettings.Networks.coduels.IPAddress }}:9090/"
        status_code: 200
        timeout: 5
        use_proxy: false
      register: taski_metrics_readiness
      until: taski_metrics_readiness.status == 200
      retries: 30
      delay: 2
